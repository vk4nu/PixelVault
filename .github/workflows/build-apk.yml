name: Build & Release Android Debug APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor to Android
        run: npx cap sync android

      - name: Setup Java Development Kit (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK for Artifact & Release
        run: |
          mkdir -p release-output
          cp android/app/build/outputs/apk/debug/app-debug.apk release-output/PixelVault-debug.apk
          echo "APK built successfully:"
          ls -lh release-output/PixelVault-debug.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PixelVault-debug-apk
          path: release-output/PixelVault-debug.apk
          retention-days: 30

      - name: Create or Update GitHub Release for Direct APK Download
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/')
        with:
          tag_name: v1.0.0-debug
          name: "Pixel Vault - Android Debug APK (v1.0.0)"
          draft: false
          prerelease: false
          make_latest: true
          body: |
            ### 📱 Pixel Vault - Android APK Direct Download

            Automatically compiled and verified via GitHub Actions.

            #### 📥 Direct Download Link:
            - **[Download PixelVault-debug.apk](https://github.com/${{ github.repository }}/releases/download/v1.0.0-debug/PixelVault-debug.apk)**

            ---
            #### 🚀 Quick Installation Guide:
            1. Open this release page on your Android device (Google Pixel recommended).
            2. Tap **`PixelVault-debug.apk`** to download.
            3. Tap the downloaded file and select **Install** *(if prompted, toggle "Allow from this source" in Chrome/Files settings)*.
            4. Launch **Pixel Vault**!
          files: release-output/PixelVault-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
